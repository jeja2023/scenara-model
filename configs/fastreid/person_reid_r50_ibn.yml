# This configuration is read by the pinned FastReID 1.3 Linux image.  Its
# Market1501-compatible directory is generated from immutable Scenara manifests
# by scripts/fastreid/prepare_dataset.py; it is not the public Market1501 set.
MODEL:
  META_ARCHITECTURE: Baseline
  BACKBONE:
    NAME: build_resnet_backbone
    NORM: BN
    DEPTH: 50x
    LAST_STRIDE: 1
    FEAT_DIM: 2048
    WITH_IBN: true
    PRETRAIN: true
  HEADS:
    NAME: EmbeddingHead
    NORM: BN
    WITH_BNNECK: true
    POOL_LAYER: GlobalAvgPool
    NECK_FEAT: before
    CLS_LAYER: Linear
  LOSSES:
    NAME: [CrossEntropyLoss, TripletLoss]
    CE:
      EPSILON: 0.1
      SCALE: 1.0
    TRI:
      MARGIN: 0.3
      HARD_MINING: true
      NORM_FEAT: false
      SCALE: 1.0

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  REA:
    ENABLED: true
    PROB: 0.5
  FLIP:
    ENABLED: true
  PADDING:
    ENABLED: true

DATASETS:
  NAMES: [Market1501]
  TESTS: [Market1501]
  COMBINEALL: false

DATALOADER:
  SAMPLER_TRAIN: NaiveIdentitySampler
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  AMP:
    ENABLED: true
  OPT: Adam
  MAX_EPOCH: 120
  BASE_LR: 0.00035
  WEIGHT_DECAY: 0.0005
  WEIGHT_DECAY_NORM: 0.0005
  IMS_PER_BATCH: 64
  SCHED: MultiStepLR
  STEPS: [40, 90]
  GAMMA: 0.1
  WARMUP_FACTOR: 0.1
  WARMUP_ITERS: 2000
  CHECKPOINT_PERIOD: 30

TEST:
  EVAL_PERIOD: 30
  IMS_PER_BATCH: 128

CUDNN_BENCHMARK: true
