# Model 独立训练模式：
# - 不依赖 Core 的登录、服务 Token 或 deployment-feedback；
# - 仍从 scenara-data 读取已发布 Dataset Version；
# - 使用 Model 自己的 Web、PostgreSQL、MinIO 和本地登录；
# - 训练产物完成准入后，生产发布仍应交由 Core 治理。
services:
  model-migrate:
    image: ${SCENARA_MODEL_IMAGE:?set SCENARA_MODEL_IMAGE}
    command: ["alembic", "upgrade", "head"]
    environment: &runtime-environment
      SCENARA_MODEL_DEPLOYMENT_PROFILE: standalone
      SCENARA_MODEL_AUTH_MODE: local
      SCENARA_MODEL_METADATA_DB_FILE: /run/secrets/model_database_url
      SCENARA_MODEL_WORKSPACE: /app
      SSL_CERT_FILE: ${SCENARA_PLATFORM_CA_FILE:-/run/tls/ca.crt}
      REQUESTS_CA_BUNDLE: ${SCENARA_PLATFORM_CA_FILE:-/run/tls/ca.crt}
      AWS_CA_BUNDLE: ${SCENARA_PLATFORM_CA_FILE:-/run/tls/ca.crt}
      PGSSLROOTCERT: ${SCENARA_PLATFORM_CA_FILE:-/run/tls/ca.crt}
    secrets:
      - model_database_url
    volumes:
      - ${SCENARA_PLATFORM_CERTS_DIR:?set SCENARA_PLATFORM_CERTS_DIR}/ca/ca.crt:/run/tls/ca.crt:ro
    networks: [platform]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=256m"]
    restart: "no"

  model-api:
    image: ${SCENARA_MODEL_IMAGE:?set SCENARA_MODEL_IMAGE}
    command: ["uvicorn", "scenara_model.api:app", "--host", "0.0.0.0", "--port", "8080", "--ssl-keyfile", "/run/tls/server.key", "--ssl-certfile", "/run/tls/server.crt", "--ssl-ca-certs", "/run/tls/ca.crt"]
    environment:
      <<: *runtime-environment
      SCENARA_MODEL_DATA_PLATFORM_URL: ${SCENARA_MODEL_DATA_PLATFORM_URL:?set HTTPS Data URL}
      SCENARA_MODEL_DATA_PLATFORM_SERVICE_TOKEN_FILE: /run/secrets/model_data_service_token
      SCENARA_MODEL_DATA_PLATFORM_CONTEXT_SIGNING_KEY_FILE: /run/secrets/model_data_context_signing_key
      SCENARA_MODEL_STORAGE_BACKEND: ${SCENARA_MODEL_STORAGE_BACKEND:?set s3 or minio}
      SCENARA_MODEL_STORAGE_URI: ${SCENARA_MODEL_STORAGE_URI:?set immutable object storage URI}
      SCENARA_MODEL_S3_ENDPOINT_URL: ${SCENARA_MODEL_S3_ENDPOINT_URL:?set HTTPS S3 endpoint}
      SCENARA_MODEL_S3_REGION: ${SCENARA_MODEL_S3_REGION:?set S3 region}
      SCENARA_MODEL_S3_ACCESS_KEY_ID_FILE: /run/secrets/model_s3_access_key
      SCENARA_MODEL_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/model_s3_secret_key
      SCENARA_MODEL_ADMIN_PASSWORD_FILE: /run/secrets/model_admin_password
      SCENARA_MODEL_SERVE_FRONTEND: "true"
      SCENARA_MODEL_CORS_ORIGINS: ${SCENARA_MODEL_CORS_ORIGINS:?set HTTPS Model origin}
    secrets:
      - model_database_url
      - model_data_service_token
      - model_data_context_signing_key
      - model_s3_access_key
      - model_s3_secret_key
      - model_admin_password
    volumes:
      - model-artifacts:/app/artifacts
      - model-shared-models:/app/shared-models
      - ${SCENARA_PLATFORM_CERTS_DIR:?set SCENARA_PLATFORM_CERTS_DIR}/ca/ca.crt:/run/tls/ca.crt:ro
      - ${SCENARA_PLATFORM_CERTS_DIR:?set SCENARA_PLATFORM_CERTS_DIR}/model/server.crt:/run/tls/server.crt:ro
      - ${SCENARA_PLATFORM_CERTS_DIR:?set SCENARA_PLATFORM_CERTS_DIR}/model/server.key:/run/tls/server.key:ro
    networks:
      platform:
        aliases: [model.scenara.internal]
    ports:
      - "127.0.0.1:${SCENARA_MODEL_HTTP_PORT:-8080}:8080"
    depends_on:
      model-migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=512m"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; c=ssl.create_default_context(cafile='/run/tls/ca.crt'); urllib.request.urlopen('https://127.0.0.1:8080/health', context=c, timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  model_database_url:
    external: true
  model_data_service_token:
    external: true
  model_data_context_signing_key:
    external: true
  model_s3_access_key:
    external: true
  model_s3_secret_key:
    external: true
  model_admin_password:
    external: true

networks:
  platform:
    external: true
    name: ${SCENARA_PLATFORM_NETWORK:?set controlled platform network}

volumes:
  model-artifacts:
  model-shared-models:
