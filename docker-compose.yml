services:
  scenara-model:
    build:
      context: .
      args:
        SCENARA_MODEL_EXTRAS: postgres,s3
    ports:
      - "8080:8080"
    restart: unless-stopped
    # 本地 .env 优先；未提供时回落到 environment 中的默认值。
    env_file:
      - path: .env
        required: false
    environment:
      SCENARA_MODEL_WORKSPACE: /app
      SCENARA_MODEL_METADATA_DB: ${SCENARA_MODEL_METADATA_DB:-artifacts/scenara_model.sqlite3}
      SCENARA_MODEL_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      SCENARA_MODEL_SERVE_FRONTEND: "false"
      SCENARA_MODEL_STORAGE_BACKEND: ${SCENARA_MODEL_STORAGE_BACKEND:-local}
      SCENARA_MODEL_STORAGE_URI: ${SCENARA_MODEL_STORAGE_URI:-artifacts/object-store}
      SCENARA_MODEL_MAX_PACKAGE_SCAN_FILES: "500"
      SCENARA_MODEL_MAX_UPLOAD_BYTES: "524288000"
      SCENARA_MODEL_PIPELINE_WORKERS: "2"
      SCENARA_MODEL_EXTERNAL_COMMAND_TIMEOUT_SECONDS: "3600"
      SCENARA_MODEL_EXTERNAL_COMMAND_LOG_MAX_CHARS: "20000"
      SCENARA_MODEL_ALLOW_SHELL_COMMANDS: "false"
      # 生产环境必须设置 SCENARA_MODEL_AUTH_TOKEN（写接口鉴权），建议通过 .env 注入。
      # 未设置时首次启动会生成随机口令并打印到容器日志（docker compose logs）。
      SCENARA_MODEL_ADMIN_PASSWORD: ${SCENARA_MODEL_ADMIN_PASSWORD:-}
    volumes:
      - ./artifacts:/app/artifacts
      - ./shared-models:/app/shared-models
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 可选生产形态：docker compose --profile postgres up
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: scenara_model
      POSTGRES_USER: scenara_model
      POSTGRES_PASSWORD: ${SCENARA_MODEL_POSTGRES_PASSWORD:-scenara-model-dev-only}
    volumes:
      - scenara-model-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scenara_model -d scenara_model"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 可选生产形态：docker compose --profile minio up
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SCENARA_MODEL_MINIO_ROOT_USER:-scenara-model}
      MINIO_ROOT_PASSWORD: ${SCENARA_MODEL_MINIO_ROOT_PASSWORD:-scenara-model-dev-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - scenara-model-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  scenara-model-postgres:
  scenara-model-minio:
