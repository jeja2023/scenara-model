[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scenara-model"
version = "1.0.0.dev3"
description = "Scenara model training, evaluation, registry, and immutable model package tooling."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2",
  "PyYAML>=6",
  "onnx>=1.15",
  "onnxruntime>=1.17",
  "python-multipart>=0.0.9",
  "uvicorn>=0.27"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "pyright>=1.1.411",
  "ruff>=0.8",
  # 迁移测试直接调用 Alembic 和 SQLAlchemy。
  "alembic>=1.13",
  "SQLAlchemy>=2.0"
]
s3 = [
  "boto3>=1.34"
]
postgres = [
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2"
]
migrations = [
  "alembic>=1.13",
  "SQLAlchemy>=2.0"
]

[project.scripts]
scenara-model = "scenara_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src", "scripts"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
  "E501",
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["I001"]
